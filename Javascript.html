<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome</title>
  </head>
  <body>
    <h1>Hosted with 
      <a href="https://www.netlify.com">Netlify</a></h1>
      <img src="src/netlify-logo.png" alt="Netlify Logo" width="200"/>
    <script>
      let firstName = prompt("What is your first name?");
      firstName = firstName.trim();

      if (firstName === "") {
        alert("Too bad for you");
      } else {
        alert("Welcome, " + firstName);
      }
    </script>
    <script src="src/script.js"></script>
  </body>
</html>
